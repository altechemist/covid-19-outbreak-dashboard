<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COVID-19 Early Outbreak Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Classic script so window.Chart exists before the deferred module runs. -->
    <script src="vendor/chart.umd.js"></script>
  </head>
  <body>
    <main>
      <h1>COVID-19 Early Outbreak</h1>
      <p class="sub">February – March 2020</p>

      <div class="controls">
        <label for="country">Country</label>
        <select id="country" disabled></select>
      </div>

      <section id="output" class="card" aria-live="polite">
        <p class="loading">Loading data&hellip;</p>
      </section>

      <section id="chart-wrap" class="card" hidden>
        <h2>Trend over time</h2>
        <div class="chart">
          <canvas id="chart"></canvas>
        </div>
      </section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
